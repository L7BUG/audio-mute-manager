[package]
name = "audio-mute-manager"
version = "0.1.0"
edition = "2021"
description = "Windows app: auto-mute background apps, restore volume when foreground"
license = "MIT"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
] }
windows-core = "0.62.2"
eframe = "0.36.0"
tray-icon = "0.24.2"
image = "0.25.10"

[profile.release]
opt-level = 3
lto = true
strip = true
